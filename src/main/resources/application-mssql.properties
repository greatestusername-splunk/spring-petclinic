# Microsoft SQL Server Configuration
# This configuration uses SQL Server Express (free version)
# Replace these values with your actual SQL Server connection details

# Database URL - Update with your SQL Server connection string  
# For SQL Server Express: jdbc:sqlserver://localhost:1433;databaseName=petclinic;encrypt=false;trustserverCertificate=true
# For SQL Server LocalDB: jdbc:sqlserver://localhost;instance=.\\SQLEXPRESS;databaseName=petclinic;integratedSecurity=true;encrypt=false;trustserverCertificate=true
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=petclinic;encrypt=false;trustServerCertificate=true

# Database credentials - Update with your SQL Server username and password
# For SQL Server Express with SQL Authentication:
spring.datasource.username=petclinic
spring.datasource.password=petclinic

# For Windows Authentication (comment out username/password above and uncomment below):
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=petclinic;integratedSecurity=true;encrypt=false;trustServerCertificate=true

# SQL Server JDBC driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate settings for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database initialization
database=mssql
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.open-in-view=true

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
